services:
  app:
    build: .
    restart: unless-stopped
    stop_grace_period: 30s
    env_file: ${THOOCK_ENV_FILE:-.env.production}
    environment:
      DATABASE_URL: postgresql://stocklab:${POSTGRES_PASSWORD}@postgres:5432/stocklab
      LOCAL_STORAGE_PATH: /app/storage
    ports:
      - "127.0.0.1:${THOOCK_APP_PORT:-3000}:3000"
    volumes:
      - stocklab_assets:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/login').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: stocklab
      POSTGRES_USER: stocklab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - stocklab_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stocklab -d stocklab"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  stocklab_postgres:
  stocklab_assets:
