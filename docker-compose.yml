services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: stocklab
      POSTGRES_USER: stocklab
      POSTGRES_PASSWORD: stocklab
    ports:
      - "5432:5432"
    volumes:
      - stocklab_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stocklab -d stocklab"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  stocklab_postgres:
